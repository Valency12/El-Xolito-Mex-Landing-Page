<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Producto – El Xolito Mex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=GFS+Didot&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="El Xolito Mex">
        <img src="assets/Logos/logo3.jpeg" alt="El Xolito Mex" class="brand-logo" />
      </a>
      <nav class="nav" aria-label="Principal">
        <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
        <ul class="nav-list">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="tienda.html">Tienda</a></li>
          <li><a href="index.html#ofertas">Ofertas</a></li>
          <li><a href="index.html#nosotros">Nosotros</a></li>
          <li><a href="index.html#contacto">Contacto</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <div class="auth-buttons" id="authButtonsContainer"></div>
        <button class="profile-toggle" id="profileToggle" aria-label="Mi cuenta">
          <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-person" viewBox="0 0 16 16">
            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
          </svg>
        </button>
        <button class="cart-toggle" aria-label="Ver carrito" data-count="0">
          <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-cart2" viewBox="0 0 16 16">
            <path d="M0 2.5A.5.5 0 0 1 .5 2H2a.5.5 0 0 1 .485.379L2.89 4H14.5a.5.5 0 0 1 .485.621l-1.5 6A.5.5 0 0 1 13 11H4a.5.5 0 0 1-.485-.379L1.61 3H.5a.5.5 0 0 1-.5-.5M3.14 5l1.25 5h8.22l1.25-5zM5 13a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0m9-1a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="border-mex"></div>
  </header>

  <main>
    <div id="productContent"></div>
  </main>

  <div id="cartModal" class="cart-modal" aria-hidden="true">
    <div class="cart-overlay"></div>
    <div class="cart-drawer">
      <div class="cart-header">
        <h3>Tu carrito</h3>
        <button class="cart-close" aria-label="Cerrar carrito">×</button>
      </div>
      <div class="cart-content">
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-empty">
          <p>Tu carrito está vacío</p>
          <a href="tienda.html" class="btn btn-primary">Ir a la tienda</a>
        </div>
      </div>
      <div class="cart-footer">
        <div class="cart-total">
          <span>Total: <strong id="cartTotal">$0</strong></span>
        </div>
        <button class="btn btn-primary cart-checkout" disabled>Proceder al pago</button>
      </div>
    </div>
  </div>

  <script src="services/authService.js"></script>
  <script src="services/productService.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
