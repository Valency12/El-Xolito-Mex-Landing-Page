<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva contraseña – El Xolito Mex</title>
  <meta name="description" content="Restablece tu contraseña de El Xolito Mex." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    .reset-page {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem 3rem;
      background: #f7f7f7;
    }
    .reset-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 12px;
      padding: 1.75rem 1.5rem 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }
    .reset-card h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.85rem;
      font-weight: 600;
      margin: 0 0 0.5rem;
    }
    .reset-card .lead {
      color: #666;
      font-size: 0.92rem;
      margin: 0 0 1.25rem;
      line-height: 1.5;
    }
    .reset-msg {
      display: none;
      margin-bottom: 1rem;
      padding: 0.75rem 0.9rem;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .reset-msg.is-error { display: block; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .reset-msg.is-success { display: block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .reset-card .auth-field-hint { display: block; margin-top: 0.4rem; color: #666; font-size: 0.8rem; }
    .reset-actions { margin-top: 1rem; }
    .reset-back { margin-top: 1rem; text-align: center; font-size: 0.9rem; }
    .reset-back a { color: #151515; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="El Xolito Mex">
        <img src="assets/Logos/logo3.jpeg" alt="El Xolito Mex" class="brand-logo" />
      </a>
    </div>
    <div class="border-mex"></div>
  </header>

  <main class="reset-page">
    <div class="reset-card">
      <h1>Nueva contraseña</h1>
      <p class="lead" id="resetLead">Elige una contraseña segura para tu cuenta.</p>
      <div id="resetMsg" class="reset-msg" role="status"></div>
      <form id="resetForm" class="auth-form">
        <div class="form-group">
          <label for="resetPassword">Nueva contraseña</label>
          <input type="password" id="resetPassword" required autocomplete="new-password" minlength="8" />
          <small class="auth-field-hint">Mínimo 8 caracteres, una mayúscula, una minúscula y un número</small>
        </div>
        <div class="form-group">
          <label for="resetPasswordConfirm">Confirmar contraseña</label>
          <input type="password" id="resetPasswordConfirm" required autocomplete="new-password" minlength="8" />
        </div>
        <div class="reset-actions form-inicio">
          <button type="submit" class="btn btn-primary" id="resetSubmit">Guardar contraseña</button>
        </div>
      </form>
      <p class="reset-back"><a href="/">Volver al inicio</a> · <a href="/" id="resetLoginLink">Iniciar sesión</a></p>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="services/authService.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const token = (params.get('token') || '').trim();
      const form = document.getElementById('resetForm');
      const msg = document.getElementById('resetMsg');
      const lead = document.getElementById('resetLead');
      const submitBtn = document.getElementById('resetSubmit');

      function showMsg(text, type) {
        msg.textContent = text;
        msg.className = 'reset-msg ' + (type === 'success' ? 'is-success' : 'is-error');
      }

      if (!token) {
        form.hidden = true;
        lead.textContent = 'Este enlace no es válido.';
        showMsg('Falta el token. Solicita un nuevo enlace desde «Olvidaste tu contraseña».', 'error');
        return;
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const password = document.getElementById('resetPassword').value;
        const confirm = document.getElementById('resetPasswordConfirm').value;

        if (password.length < 8 || !/(?=.*[a-z])(?=.*[A-Z])(?=.*\d)/.test(password)) {
          showMsg('La contraseña debe tener al menos 8 caracteres, mayúscula, minúscula y un número.', 'error');
          return;
        }
        if (password !== confirm) {
          showMsg('Las contraseñas no coinciden.', 'error');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Guardando...';
        try {
          const result = await window.authService.resetPassword(token, password);
          if (!result.success) {
            showMsg(result.message || 'No se pudo actualizar la contraseña.', 'error');
            return;
          }
          form.hidden = true;
          lead.textContent = 'Listo.';
          showMsg(result.message || 'Contraseña actualizada. Ya puedes iniciar sesión.', 'success');
          setTimeout(function () {
            window.location.href = '/?login=1';
          }, 1800);
        } catch (err) {
          showMsg(err.message || 'Error al guardar.', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Guardar contraseña';
        }
      });

      document.getElementById('resetLoginLink').addEventListener('click', function (e) {
        e.preventDefault();
        window.location.href = '/?login=1';
      });
    })();
  </script>
</body>
</html>
