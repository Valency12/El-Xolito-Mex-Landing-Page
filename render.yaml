# Blueprint para desplegar la API en Render (plan gratuito).
# Conectar repo en https://dashboard.render.com → New → Blueprint
services:
  - type: web
    name: elxolito-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm rebuild better-sqlite3 --build-from-source
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://www.elxolitomex.com,https://elxolitomex.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://elxolito-api.onrender.com
      - key: SITE_URL
        value: https://www.elxolitomex.com
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: hola@elxolitomex.com
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: hola@elxolitomex.com
      - key: ADMIN_EMAIL
        value: admin@elxolitomex.com
